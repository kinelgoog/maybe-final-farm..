<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Steam Idler | Premium</title>
  <style>
    :root {
      /* Палитра в стиле "Deep Purple Liquid" */
      --bg-dark: #050508;
      --bg-light: #f0f2f8;
      --accent: #9d50ff;
      --accent-glow: rgba(157, 80, 255, 0.4);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-dim: #94a3b8;
      --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
    }

    [data-theme="light"] {
      --bg-dark: #f0f2f8;
      --accent: #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.2);
      --glass-bg: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(0, 0, 0, 0.05);
      --text-main: #1e1e2e;
      --text-dim: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'SF Pro Display', -apple-system, system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.6s ease;
    }

    /* Живой фон: Мягкие градиентные пятна */
    .mesh-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 80% 20%, var(--accent-glow) 0%, transparent 40%),
                  radial-gradient(circle at 10% 80%, rgba(63, 94, 251, 0.1) 0%, transparent 40%);
      filter: blur(80px);
    }

    #star-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* Dynamic Island: Liquid Effect */
    .island {
      position: fixed;
      top: 20px;
      padding: 12px 28px;
      border-radius: 30px;
      background: rgba(10, 10, 15, 0.8);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: flex; align-items: center; gap: 12px;
      font-weight: 600; font-size: 14px;
      transform: translateY(-100px);
      transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
      z-index: 1000;
    }
    .island.show { transform: translateY(0); }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 100px 20px 40px;
      position: relative;
      z-index: 10;
    }

    /* Эффект Liquid Glass для карточки */
    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 30px;
      box-shadow: inset 0 0 20px rgba(255,255,255,0.02), 0 25px 50px -12px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    /* Авторский блик на поверхности "стекла" */
    .card::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.03), transparent);
      transform: rotate(-45deg);
      pointer-events: none;
    }

    .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; }
    
    .logo-area b { font-size: 22px; letter-spacing: -0.5px; display: block; }
    .logo-area span { color: var(--text-dim); font-size: 13px; }

    .badge {
      background: rgba(255,255,255,0.05);
      padding: 6px 14px; border-radius: 12px;
      font-size: 12px; font-weight: 700; color: var(--accent);
      border: 1px solid rgba(157, 80, 255, 0.2);
    }
    .badge.online { color: #10b981; border-color: rgba(16, 185, 129, 0.2); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
    .stat-item {
      background: rgba(0,0,0,0.2);
      padding: 20px; border-radius: 24px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .stat-item .num { font-size: 28px; font-weight: 800; color: var(--text-main); }
    .stat-item .label { font-size: 11px; text-transform: uppercase; color: var(--text-dim); letter-spacing: 1px; margin-top: 4px; }

    /* Кастомные прогресс-бары "Liquid" */
    .progress-group { margin-bottom: 20px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
    .bar-bg { height: 10px; background: rgba(0,0,0,0.3); border-radius: 10px; overflow: hidden; }
    .bar-fill {
      height: 100%; background: linear-gradient(90deg, var(--accent), #c084fc);
      width: 0%; transition: width 1s ease; border-radius: 10px;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .bar-fill.gold { background: linear-gradient(90deg, #f59e0b, #fbbf24); box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }

    .game-list {
      background: rgba(0,0,0,0.15);
      border-radius: 20px; padding: 15px;
      max-height: 150px; overflow-y: auto; margin-bottom: 25px;
    }
    .game-node {
      display: flex; justify-content: space-between; padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 14px;
    }
    .game-node:last-child { border: none; }

    .actions { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 12px; }
    .btn {
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,0.03);
      padding: 14px; border-radius: 18px; color: var(--text-main);
      font-weight: 600; cursor: pointer; transition: var(--transition);
    }
    .btn:hover { background: rgba(255,255,255,0.08); }
    .btn.primary {
      background: var(--accent); color: white; border: none;
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .btn.primary:hover { transform: translateY(-2px); box-shadow: 0 12px 25px var(--accent-glow); }

    .accounts-nav { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; width: 100%; padding: 5px; }
    .accounts-nav::-webkit-scrollbar { display: none; }
    .acc-item {
      padding: 8px 18px; border-radius: 15px; background: var(--glass-bg);
      border: 1px solid var(--glass-border); font-size: 13px; font-weight: 600;
      white-space: nowrap; cursor: pointer; transition: var(--transition);
    }
    .acc-item.active { background: var(--accent); color: white; border-color: transparent; }

    .theme-switch {
      position: absolute; top: 40px; right: 20px;
      width: 45px; height: 45px; border-radius: 50%;
      background: var(--glass-bg); border: 1px solid var(--glass-border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-main); transition: var(--transition);
    }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-content {
      width: 100%; max-width: 380px; padding: 30px;
      background: rgba(20,20,25,0.9); border: 1px solid var(--glass-border);
      border-radius: 32px; box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }
    input {
      width: 100%; padding: 14px 18px; margin: 10px 0;
      background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
      border-radius: 15px; color: white; outline: none; transition: 0.3s;
    }
    input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }
  </style>
</head>
<body>

  <div class="mesh-bg"></div>
  <canvas id="star-canvas"></canvas>

  <div class="island" id="island"></div>

  <div class="theme-switch" id="theme-btn">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
  </div>

  <div class="container">
    <div class="accounts-nav" id="acc-list"></div>

    <div class="card">
      <div class="top-row">
        <div class="logo-area">
          <b>Steam Idler</b>
          <span>Automated Farming System</span>
        </div>
        <div class="badge" id="status-badge">Оффлайн</div>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <div class="num" id="stat-h">0.00</div>
          <div class="label">Total Hours</div>
        </div>
        <div class="stat-item">
          <div class="num" id="stat-c">0</div>
          <div class="label">Card Drops</div>
        </div>
      </div>

      <div class="progress-group">
        <div class="progress-meta"><span>Session Progress</span><span id="txt-s">0ч 0м</span></div>
        <div class="bar-bg"><div class="bar-fill" id="bar-s"></div></div>
      </div>

      <div class="progress-group">
        <div class="progress-meta"><span>Next Card Probability</span><span id="txt-c">0м</span></div>
        <div class="bar-bg"><div class="bar-fill gold" id="bar-c"></div></div>
      </div>

      <div class="game-list" id="game-container">
        <div style="text-align:center; color:var(--text-dim); font-size:13px; padding:10px;">Синхронизация...</div>
      </div>

      <div class="actions">
        <button class="btn" id="ui-add">+ Add</button>
        <button class="btn" id="ui-sync">Games</button>
        <button class="btn primary" id="ui-toggle">Start</button>
      </div>
    </div>
  </div>

  <div class="modal" id="ui-modal">
    <div class="modal-content">
      <h3 style="margin-bottom:15px">New Connection</h3>
      <input id="in-user" placeholder="Steam Login">
      <input id="in-pass" type="password" placeholder="Password">
      <input id="in-apps" placeholder="App IDs (730, 322170...)">
      <button class="btn primary" style="width:100%; margin-top:15px" id="in-submit">Link Account</button>
    </div>
  </div>

  <script>
    (function() {
      let activeId = null;
      const get = id => document.getElementById(id);

      function msg(text) {
        const i = get('island'); i.textContent = text; i.classList.add('show');
        setTimeout(() => i.classList.remove('show'), 3000);
      }

      get('theme-btn').onclick = () => {
        const h = document.documentElement;
        h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      };

      function updateUI() {
        if (!activeId) return;
        fetch('/status/' + activeId).then(r => r.json()).then(d => {
          get('stat-h').textContent = d.totalHours;
          get('stat-c').textContent = d.totalCards;
          get('bar-s').style.width = d.cardProgress + '%';
          get('bar-c').style.width = d.cardProgress + '%';
          get('txt-c').textContent = d.cardTimer;
          get('txt-s').textContent = Math.floor(d.totalHours % 24) + 'h ' + Math.floor((d.totalHours*60)%60) + 'm';
          
          const isOn = d.loggedIn;
          get('status-badge').textContent = isOn ? 'Фарм идёт' : 'Остановлен';
          get('status-badge').className = isOn ? 'badge online' : 'badge';
          get('ui-toggle').textContent = isOn ? 'Stop' : 'Start';
          get('ui-toggle').style.background = isOn ? 'rgba(239, 68, 68, 0.2)' : '';
          
          const gBox = get('game-container'); gBox.innerHTML = '';
          if (!d.appIds || d.appIds.length === 0) gBox.innerHTML = '<div style="text-align:center;padding:10px;font-size:12px;color:var(--text-dim)">No active games</div>';
          else d.appIds.forEach(id => {
            let name = 'App ' + id;
            if (id == 730) name = 'CS2';
            if (id == 4465480) name = 'CS:GO Legacy';
            if (id == 322170) name = 'Geometry Dash';
            gBox.innerHTML += `<div class="game-node"><span>${name}</span><span style="color:var(--accent)">${id}</span></div>`;
          });
        });
      }

      fetch('/accounts').then(r => r.json()).then(d => {
        const nav = get('acc-list');
        d.accounts.forEach(a => {
          const div = document.createElement('div');
          div.className = 'acc-item' + (a.id === d.currentAccount ? ' active' : '');
          div.textContent = a.login;
          div.onclick = () => {
            document.querySelectorAll('.acc-item').forEach(el => el.classList.remove('active'));
            div.classList.add('active');
            activeId = a.id; updateUI();
          };
          nav.appendChild(div);
        });
        if (d.currentAccount) { activeId = d.currentAccount; updateUI(); }
        else if (d.accounts.length) { activeId = d.accounts[0].id; updateUI(); }
        setInterval(updateUI, 10000);
      });

      get('ui-add').onclick = () => get('ui-modal').classList.add('show');
      get('ui-modal').onclick = e => { if (e.target.id === 'ui-modal') get('ui-modal').classList.remove('show'); };
      
      get('in-submit').onclick = () => {
        const l = get('in-user').value, p = get('in-pass').value, a = get('in-apps').value;
        fetch('/accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: l, password: p, apps: a.split(',').map(Number).filter(Boolean) })
        }).then(() => location.reload());
      };

      get('ui-toggle').onclick = () => {
        const act = get('ui-toggle').textContent === 'Stop' ? 'stop' : 'start';
        msg(act === 'start' ? 'Connecting to Steam...' : 'Disconnecting...');
        fetch('/control/' + activeId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: act })
        }).then(() => setTimeout(updateUI, 1000));
      };

      get('ui-sync').onclick = () => {
        fetch('/control/' + activeId, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'check' })
        });
        msg('Scanning library...');
      };

      // Высокопроизводительные звезды на Canvas
      const cvs = get('star-canvas'), ctx = cvs.getContext('2d');
      let stars = [];
      const resize = () => { cvs.width = window.innerWidth; cvs.height = window.innerHeight; };
      window.onresize = resize; resize();

      for (let i = 0; i < 30; i++) {
        stars.push({ x: Math.random()*cvs.width, y: Math.random()*cvs.height, s: Math.random()*5+2, v: Math.random()*0.5+0.2, o: Math.random() });
      }

      function drawS(cx, cy, spikes, outer, inner, o) {
        let rot = Math.PI/2*3, x = cx, y = cy, step = Math.PI/spikes;
        ctx.beginPath(); ctx.moveTo(cx, cy-outer);
        for(let i=0; i<spikes; i++) {
          x=cx+Math.cos(rot)*outer; y=cy+Math.sin(rot)*outer; ctx.lineTo(x,y); rot+=step;
          x=cx+Math.cos(rot)*inner; y=cy+Math.sin(rot)*inner; ctx.lineTo(x,y); rot+=step;
        }
        ctx.closePath();
        ctx.fillStyle = `rgba(157, 80, 255, ${o})`;
        ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(157, 80, 255, 0.5)';
        ctx.fill(); ctx.shadowBlur = 0;
      }

      function anim() {
        ctx.clearRect(0,0,cvs.width,cvs.height);
        stars.forEach(s => {
          s.y += s.v; if (s.y > cvs.height) { s.y = -10; s.x = Math.random()*cvs.width; }
          drawS(s.x, s.y, 5, s.s, s.s/2, s.o);
        });
        requestAnimationFrame(anim);
      }
      anim();
    })();
  </script>
</body>
  </html>
