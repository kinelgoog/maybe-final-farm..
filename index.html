<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Steam Idler | Qwen Edition</title>
  <style>
    :root {
      --p-deep: #08080c;
      --p-accent: #a855f7;
      --p-accent-glow: rgba(168, 85, 247, 0.4);
      --p-glass: rgba(15, 15, 20, 0.6);
      --p-border: rgba(255, 255, 255, 0.08);
      --p-text: #ffffff;
      --p-text-dim: #94a3b8;
      --bezier: cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --p-deep: #f8fafc;
      --p-accent: #8b5cf6;
      --p-accent-glow: rgba(139, 92, 246, 0.2);
      --p-glass: rgba(255, 255, 255, 0.7);
      --p-border: rgba(0, 0, 0, 0.05);
      --p-text: #0f172a;
      --p-text-dim: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
    
    body {
      background: var(--p-deep);
      color: var(--p-text);
      overflow: hidden; /* Весь скролл внутри контейнера для плавности */
      height: 100vh;
      display: flex;
      justify-content: center;
      transition: background 0.5s var(--bezier);
    }

    /* Фоновый холст для звезд - оптимизирован на 120 FPS */
    #canvas-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Жидкое пятно света на фоне (GPU Accelerated) */
    .nebula {
      position: fixed;
      top: -10%; right: -10%;
      width: 60vw; height: 60vw;
      background: radial-gradient(circle, var(--p-accent-glow) 0%, transparent 70%);
      filter: blur(100px);
      z-index: 1;
      will-change: transform;
      animation: drift 20s infinite alternate ease-in-out;
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(-10%, 10%); }
    }

    /* Dynamic Island: Реально "жидкий" дизайн */
    .island-wrap {
      position: fixed;
      top: 20px;
      z-index: 1000;
      display: flex;
      justify-content: center;
      width: 100%;
      pointer-events: none;
    }

    .island {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 0.5px solid var(--p-border);
      border-radius: 30px;
      padding: 8px 20px;
      min-width: 120px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: white;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: translateY(-100px);
      transition: all 0.7s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }

    .island.active { transform: translateY(0); }

    /* Главный контейнер */
    .app-shell {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      height: 100%;
      padding: 90px 20px 20px;
      display: flex;
      flex-direction: column;
    }

    /* Авторская карточка Nebula Glass */
    .glass-card {
      background: var(--p-glass);
      border: 1px solid var(--p-border);
      border-radius: 35px;
      padding: 30px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2);
      /* Оптимизация для мобилок: убираем тяжелый blur на скролле */
      contain: content;
    }

    /* Световое ребро (авторский эффект) */
    .glass-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--p-accent), transparent);
      opacity: 0.5;
    }

    .header-main { margin-bottom: 25px; }
    .header-main h1 { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
    .header-main p { font-size: 12px; color: var(--p-text-dim); text-transform: uppercase; letter-spacing: 2px; margin-top: 4px; }

    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-pill {
      background: rgba(0,0,0,0.2);
      padding: 15px 20px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,0.03);
    }

    .stat-pill .val { font-size: 26px; font-weight: 800; display: block; color: var(--p-accent); }
    .stat-pill .lbl { font-size: 10px; color: var(--p-text-dim); text-transform: uppercase; font-weight: 700; }

    /* Жидкий прогресс-бар */
    .progress-box { margin-bottom: 15px; }
    .progress-info { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; font-weight: 600; }
    .track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; position: relative; }
    .fill {
      height: 100%;
      background: linear-gradient(90deg, var(--p-accent), #d8b4fe);
      width: 0%;
      transition: width 1s var(--bezier);
      box-shadow: 0 0 10px var(--p-accent-glow);
    }

    .fill.gold { background: linear-gradient(90deg, #facc15, #fbbf24); box-shadow: 0 0 10px rgba(250, 204, 21, 0.3); }

    /* Список игр с эффектом "Голограммы" */
    .game-scroller {
      margin: 15px 0 25px;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .game-scroller::-webkit-scrollbar { width: 4px; }
    .game-scroller::-webkit-scrollbar-thumb { background: var(--p-border); border-radius: 10px; }

    .game-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .game-card span:first-child { font-weight: 600; font-size: 14px; }
    .game-card span:last-child { color: var(--p-accent); font-family: monospace; font-size: 12px; }

    /* Кнопки в стиле "Futuristic Glass" */
    .btn-group { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 10px; }
    
    .btn-base {
      border: 1px solid var(--p-border);
      background: rgba(255,255,255,0.03);
      padding: 14px;
      border-radius: 20px;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s var(--bezier);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-base:active { transform: scale(0.95); }
    
    .btn-base.primary {
      background: var(--p-accent);
      border: none;
      box-shadow: 0 10px 20px var(--p-accent-glow);
    }

    /* Навигация по аккаунтам */
    .account-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      margin-bottom: 15px;
      padding: 5px;
    }
    .account-tabs::-webkit-scrollbar { display: none; }

    .tab {
      padding: 8px 18px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--p-border);
      border-radius: 15px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.3s;
    }
    .tab.active { background: var(--p-text); color: var(--p-deep); border-color: transparent; }

    /* Переключатель темы (SVG) */
    .theme-switch {
      position: absolute; top: 40px; left: 20px;
      width: 40px; height: 40px;
      background: var(--p-glass);
      border: 1px solid var(--p-border);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 100;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    
    .modal-body {
      background: #0f0f15; border: 1px solid var(--p-border);
      border-radius: 30px; padding: 30px; width: 100%; max-width: 360px;
    }

    input {
      width: 100%; padding: 14px; margin: 10px 0;
      background: rgba(255,255,255,0.05); border: 1px solid var(--p-border);
      border-radius: 15px; color: white; outline: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas-bg"></canvas>
  <div class="nebula"></div>

  <div class="theme-switch" id="theme-btn">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path></svg>
  </div>

  <div class="island-wrap">
    <div class="island" id="island">
      <div id="isl-content">System Ready</div>
    </div>
  </div>

  <div class="app-shell">
    <div class="account-tabs" id="acc-tabs"></div>

    <div class="glass-card">
      <div class="header-main">
        <h1 id="user-display">Steam Idler</h1>
        <p id="status-label">Offline</p>
      </div>

      <div class="stats-row">
        <div class="stat-pill">
          <span class="val" id="h-val">0.0</span>
          <span class="lbl">Farmed Hours</span>
        </div>
        <div class="stat-pill">
          <span class="val" id="c-val">0</span>
          <span class="lbl">Card Drops</span>
        </div>
      </div>

      <div class="progress-box">
        <div class="progress-info"><span>Farming Session</span><span id="h-time">0h 0m</span></div>
        <div class="track"><div class="fill" id="h-fill"></div></div>
      </div>

      <div class="progress-box">
        <div class="progress-info"><span>Probability</span><span id="c-time">0m</span></div>
        <div class="track"><div class="fill gold" id="c-fill"></div></div>
      </div>

      <div class="game-scroller" id="game-list"></div>

      <div class="btn-group">
        <button class="btn-base" id="add-acc">+ Add</button>
        <button class="btn-base" id="sync-games">Sync</button>
        <button class="btn-base primary" id="toggle-farm">Start</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-body">
      <h2 style="margin-bottom:20px">New Account</h2>
      <input id="in-user" placeholder="Steam Login">
      <input id="in-pass" type="password" placeholder="Password">
      <input id="in-apps" placeholder="App IDs (730, 4465480...)">
      <button class="btn-base primary" style="width:100%; margin-top:10px" id="in-save">Connect</button>
    </div>
  </div>

  <script>
    (function() {
      let activeAcc = null;
      const $ = id => document.getElementById(id);

      function uiNotify(text) {
        const isl = $('island');
        $('isl-content').textContent = text;
        isl.classList.add('active');
        setTimeout(() => isl.classList.remove('active'), 3000);
      }

      $('theme-btn').onclick = () => {
        const h = document.documentElement;
        h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      };

      function refresh() {
        if (!activeAcc) return;
        fetch('/status/' + activeAcc).then(r => r.json()).then(d => {
          $('h-val').textContent = d.totalHours;
          $('c-val').textContent = d.totalCards;
          $('h-fill').style.width = d.cardProgress + '%';
          $('c-fill').style.width = d.cardProgress + '%';
          $('c-time').textContent = d.cardTimer;
          $('h-time').textContent = Math.floor(d.totalHours % 24) + 'h ' + Math.floor((d.totalHours*60)%60) + 'm';
          
          const isOn = d.loggedIn;
          $('status-label').textContent = isOn ? 'Farming Active' : 'System Idle';
          $('status-label').style.color = isOn ? 'var(--p-accent)' : '';
          $('toggle-farm').textContent = isOn ? 'Stop' : 'Start';
          $('toggle-farm').style.background = isOn ? 'rgba(239, 68, 68, 0.8)' : '';
          
          const list = $('game-list');
          list.innerHTML = '';
          if (d.appIds) d.appIds.forEach(id => {
            let name = 'App ' + id;
            if (id == 730) name = 'CS2';
            if (id == 4465480) name = 'CS:GO Legacy';
            if (id == 322170) name = 'Geometry Dash';
            list.innerHTML += `<div class="game-card"><span>${name}</span><span>${id}</span></div>`;
          });
        });
      }

      fetch('/accounts').then(r => r.json()).then(d => {
        const tabs = $('acc-tabs');
        d.accounts.forEach(a => {
          const t = document.createElement('div');
          t.className = 'tab' + (a.id === d.currentAccount ? ' active' : '');
          t.textContent = a.login;
          t.onclick = () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            activeAcc = a.id; 
            $('user-display').textContent = a.login;
            refresh();
          };
          tabs.appendChild(t);
        });
        if (d.currentAccount) { 
          activeAcc = d.currentAccount; 
          $('user-display').textContent = d.accounts.find(x => x.id === activeAcc).login;
          refresh(); 
        }
        setInterval(refresh, 15000);
      });

      $('add-acc').onclick = () => $('modal').classList.add('open');
      $('modal').onclick = e => { if(e.target.id === 'modal') $('modal').classList.remove('open'); };
      
      $('in-save').onclick = () => {
        const l = $('in-user').value, p = $('in-pass').value, a = $('in-apps').value;
        fetch('/accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ login: l, password: p, apps: a.split(',').map(Number).filter(Boolean) })
        }).then(() => location.reload());
      };

      $('toggle-farm').onclick = () => {
        const act = $('toggle-farm').textContent === 'Stop' ? 'stop' : 'start';
        uiNotify(act === 'start' ? 'Initialising Steam...' : 'Disconnecting...');
        fetch('/control/' + activeAcc, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: act })
        }).then(() => setTimeout(refresh, 1000));
      };

      // --- CANVAS ENGINE (60 FPS STARS) ---
      const canvas = $('canvas-bg'), ctx = canvas.getContext('2d');
      let stars = [];
      const resize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
      window.onresize = resize; resize();

      for (let i = 0; i < 40; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          s: Math.random() * 4 + 2,
          v: Math.random() * 0.4 + 0.1,
          t: Math.random() * Math.PI * 2 // для мерцания
        });
      }

      function drawStar(x, y, size, alpha) {
        ctx.save();
        ctx.translate(x, y);
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
          ctx.lineTo(0, -size);
          ctx.rotate(Math.PI / 5);
          ctx.lineTo(0, -size / 2);
          ctx.rotate(Math.PI / 5);
        }
        ctx.fillStyle = `rgba(168, 85, 247, ${alpha})`;
        ctx.fill();
        ctx.restore();
      }

      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => {
          s.y += s.v;
          s.t += 0.02;
          if (s.y > canvas.height) s.y = -10;
          const alpha = 0.2 + (Math.sin(s.t) * 0.3); // Мягкое мерцание
          drawStar(s.x, s.y, s.s, alpha);
        });
        requestAnimationFrame(loop);
      }
      loop();
    })();
  </script>
</body>
</html>
