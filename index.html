<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Steam Idler — Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --card-bg: rgba(20, 20, 30, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #ffffff;
      --text-secondary: #a0a0b0;
      --accent: #a855f7;
      --success: #00ff88;
    }
    body {
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    #star-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      position: relative;
      margin: 0 auto;
      max-width: 600px;
      margin-top: 80px;
      overflow: hidden;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
    }
    .stat-value { font-size: 36px; font-weight: 700; }
    .stat-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; }
    .progress-bar-container {
      height: 8px;
      background: rgba(255,255,255,0.05);
      border-radius: 10px;
      overflow: hidden;
      margin: 10px 0;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--success));
      border-radius: 10px;
      width: 0%;
      transition: width 1s ease;
    }
    .game-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 30px;
    }
    .btn {
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      border: 1px solid var(--card-border);
    }
    .btn.primary {
      background: var(--accent);
      color: white;
    }
  </style>
</head>
<body>
  <canvas id="star-canvas"></canvas>
  <div class="glass-card">
    <h1 style="color:var(--accent);text-align:center;">Steam Idler</h1>
    <p style="text-align:center;color:var(--text-secondary);">Загрузка...</p>
  </div>

  <script>
    // Простой клиентский JS — без require, без Node
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('star-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      function drawStar(x, y, size) {
        ctx.beginPath();
        const angle = Math.PI / 5;
        for (let i = 0; i < 10; i++) {
          const r = i % 2 === 0 ? size : size * 0.4;
          const theta = i * angle;
          const px = x + Math.cos(theta) * r;
          const py = y + Math.sin(theta) * r;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(255,255,255,' + (size * 0.3) + ')';
        ctx.fill();
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);
        for (let i = 0; i < 80; i++) {
          const x = Math.random() * width;
          const y = Math.random() * height;
          const size = Math.random() * 2;
          drawStar(x, y, size);
        }
        requestAnimationFrame(animate);
      }

      window.addEventListener('resize', resize);
      resize();
      animate();

      // Подгрузка данных
      fetch('/accounts')
        .then(r => r.json())
        .then(data => {
          const card = document.querySelector('.glass-card');
          card.innerHTML = `
            <h1 style="color:var(--accent);text-align:center;">Steam Idler</h1>
            <div style="margin:20px 0;text-align:center;">
              <div>Аккаунтов: ${data.accounts.length}</div>
              <button class="btn primary" onclick="window.location.href='/accounts'">Управление</button>
            </div>
          `;
        })
        .catch(() => {
          document.querySelector('.glass-card p').textContent = 'Ошибка загрузки';
        });
    });
  </script>
</body>
</html>
